<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Poker Math - Full Formula</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-white: #ffffff;
            --accent-pink: #ff00cc;
            --accent-purple: #333399;
            --accent-orange: #ff9966;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Ambient Background Blobs (Liquid Gradients) --- */
        .blob-cont {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.8;
            animation: move 20s infinite alternate;
        }

        .blob:nth-child(1) {
            top: 10%;
            left: 10%;
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #ff00cc, #333399);
            animation-duration: 25s;
        }

        .blob:nth-child(2) {
            bottom: 20%;
            right: 10%;
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, #ff9966, #ff5e62);
            animation-duration: 30s;
        }

        .blob:nth-child(3) {
            top: 40%;
            left: 40%;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #8E2DE2, #4A00E0);
            animation-duration: 22s;
        }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, -50px) scale(1.1); }
        }

        /* --- The Glass Card --- */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 900px;
            min-height: 550px;
            padding: 50px;
            
            /* True Glassmorphism Properties */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 20px 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 30px;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-white);
        }

        h1 {
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 1.8rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        h3 {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            font-size: 1rem;
            text-align: center;
        }

        /* --- Equation Styling --- */
        .equation-container {
            font-family: 'Times New Roman', serif;
            font-size: 2.8rem;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 60px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            justify-content: center;
        }

        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .fraction-bar {
            width: 100%;
            height: 3px;
            background: white;
            margin: 8px 0;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Interactive Zones */
        .interactive-zone {
            padding: 10px 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            background: rgba(255,255,255,0); /* Transparent start */
        }

        /* Hover Effects */
        .interactive-zone:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
        }
        
        .interactive-zone:hover::after {
            content: 'Tap for info';
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-family: sans-serif;
            font-style: normal;
            opacity: 0.8;
            white-space: nowrap;
        }

        /* --- Explanation Panel --- */
        .explanation-panel {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        .exp-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff9966, #ff5e62);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .exp-body {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            max-width: 750px;
        }

        .default-msg {
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }
        
        /* Mobile */
        @media (max-width: 600px) {
            .equation-container { font-size: 1.6rem; }
            .glass-card { padding: 20px; width: 95%; }
            .interactive-zone { padding: 5px 10px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Liquid Background -->
    <div class="blob-cont">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- Main Glass Card -->
    <div class="glass-card">
        <h1>Equation 11.7</h1>
        <h3>Hover over parts of the equation to see the logic</h3>

        <div class="equation-container">
            
            <!-- Left Side (Cost) -->
            <div class="fraction interactive-zone" data-target="cost">
                <div>B</div>
                <div class="fraction-bar"></div>
                <div>B + P</div>
            </div>

            <div style="margin: 0 15px;">&lt;</div>

            <!-- Right Side (Efficiency) -->
            <div class="fraction">
                <!-- Whole Numerator Zone -->
                <div class="interactive-zone" data-target="numerator">
                    F<sub>T</sub> - F<sub>T</sub>E<sub>f</sub>
                </div>
                
                <div class="fraction-bar"></div>
                
                <!-- Whole Denominator Zone -->
                <div class="interactive-zone" data-target="denominator">
                    1 - E<sub>s</sub>
                </div>
            </div>

        </div>

        <!-- Dynamic Explanation Panel -->
        <div class="explanation-panel">
            <div id="exp-title" class="exp-title"></div>
            <div id="exp-body" class="exp-body default-msg">
                Interact with the equation above to see the breakdown.
            </div>
        </div>
    </div>

    <script>
        // Data content
        const data = {
            cost: {
                title: "The Cost of the Bluff",
                text: "This represents the raw price you pay to make the bet. <br>If you bet <strong>$50</strong> into a <strong>$100</strong> pot, your cost is <strong>33%</strong>. For a bluff to be profitable, the Bluff Efficiency (right side) must be higher than this cost."
            },
            numerator: {
                title: "Numerator: Folded Threats",
                text: "<strong>(F<sub>T</sub> - F<sub>T</sub>E<sub>f</sub>)</strong><br>This isolates the 'useful' folds. F<sub>T</sub> is how often they fold, and F<sub>T</sub>E<sub>f</sub> is the value of hands you were already beating that fold. <br>When you subtract them, you are left with the percentage of <strong>better hands</strong> that you forced to fold."
            },
            denominator: {
                title: "Denominator: Total Threats",
                text: "<strong>(1 - E<sub>s</sub>)</strong><br>This represents the 'Target Audience' for your bluff. <br>'1' is the opponent's entire range, and E<sub>s</sub> are the hands you are already beating. Therefore, 1 - E<sub>s</sub> represents the <strong>Danger Zone</strong>: the total volume of hands that are currently beating you."
            }
        };

        // DOM Elements
        const zones = document.querySelectorAll('.interactive-zone');
        const titleEl = document.getElementById('exp-title');
        const bodyEl = document.getElementById('exp-body');

        // Logic
        zones.forEach(zone => {
            zone.addEventListener('mouseenter', () => {
                const key = zone.getAttribute('data-target');
                if(data[key]) {
                    titleEl.innerHTML = data[key].title;
                    bodyEl.innerHTML = data[key].text;
                    bodyEl.classList.remove('default-msg');
                }
            });
            
            // Clean up on mouse leave (Optional - keeping last selection is usually better UX for reading)
        });

    </script>
</body>
</html>
